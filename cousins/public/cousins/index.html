<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Cousins</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/cousins/css/style.css">
</head>
<body>
  <main class="login">
    <div class="coaster">
      <section id="name-screen">
        <h1>Who's playing?</h1>
        <div id="name-grid" class="name-grid"></div>
      </section>
      <section id="pin-screen" hidden>
        <h1 id="pin-name"></h1>
        <p id="pin-dots" class="pin-dots"></p>
        <p id="pin-error" class="pin-error" hidden>Wrong PIN — try again.</p>
        <div id="pin-pad" class="pin-pad"></div>
        <button id="back-to-names" class="link-button">&larr; not me</button>
      </section>
    </div>
  </main>
  <script type="module" src="/cousins/js/login.js"></script>
</body>
</html>
