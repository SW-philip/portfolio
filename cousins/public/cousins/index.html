<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Cousins</title>
  <link rel="stylesheet" href="/cousins/css/style.css">
</head>
<body>
  <main class="login">
    <section id="name-screen">
      <h1>Who's playing?</h1>
      <div id="name-grid" class="name-grid"></div>
    </section>
    <section id="pin-screen" hidden>
      <h1 id="pin-name"></h1>
      <p id="pin-dots" class="pin-dots"></p>
      <p id="pin-error" class="pin-error" hidden>Wrong PIN — try again.</p>
      <div id="pin-pad" class="pin-pad"></div>
      <button id="back-to-names" class="link-button">&larr; not me</button>
    </section>
  </main>
  <script type="module" src="/cousins/js/login.js"></script>
</body>
</html>
